[project]
name = "interpretable-extractive-graphs"
version = "0.1.0"
description = "Interpretable and Efficient Multi-Relational Graph Extractive Summarization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.11.2",
  "numpy>=2.5.4",
  "pandas>=3.0.6",
  "rouge-score>=0.1.2",
  "seaborn>=0.13.2",
  "sentence-transformers>=6.1.0",
  "spacy>=3.8.16",
  "torch>=2.5.0",
]

[tool.uv.build-backend]
module-name = "interpretable_extractive_graphs"

[project.scripts]
interpretable-extractive-graphs = "interpretable_extractive_graphs:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.0"]
